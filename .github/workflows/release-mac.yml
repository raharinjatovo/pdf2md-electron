name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach asset to'
        required: true
        default: 'v1.0.0'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS app
        run: npx electron-builder --mac zip --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Find and rename zip
        run: |
          ls dist/
          ZIP=$(ls dist/*.zip | head -1)
          echo "Found: $ZIP"
          cp "$ZIP" PDF-to-Markdown-mac.zip

      - name: Upload to GitHub Release
        run: gh release upload ${{ github.event.inputs.tag }} PDF-to-Markdown-mac.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
