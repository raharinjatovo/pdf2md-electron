name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach asset to'
        required: true
        default: 'v1.0.0'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS app
        run: npm run build:mac

      - name: Inspect build output
        run: find dist -maxdepth 3 -name "*.app" -o -name "*.exe" | head -20

      - name: Package as zip
        run: |
          APP=$(find dist -maxdepth 3 -name "*.app" | head -1)
          echo "Found: $APP"
          ditto -c -k --keepParent "$APP" "PDF-to-Markdown-mac.zip"

      - name: Upload to GitHub Release
        run: gh release upload ${{ github.event.inputs.tag }} PDF-to-Markdown-mac.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
