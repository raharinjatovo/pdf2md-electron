name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach asset to'
        required: true
        default: 'v1.0.0'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS app
        run: npm run build:mac

      - name: Package as zip
        run: |
          ditto -c -k --keepParent \
            "dist/PDF-to-Markdown-darwin-x64/PDF-to-Markdown.app" \
            "PDF-to-Markdown-mac.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: PDF-to-Markdown-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
