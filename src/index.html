<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF → Markdown</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273449;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --error: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      -webkit-app-region: drag;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header span {
      color: var(--text-muted);
      font-size: 13px;
    }

    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 16px;
      overflow: hidden;
    }

    /* ── Drop zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--surface);
    }

    #drop-zone.drag-over {
      border-color: var(--accent);
      background: #1e2a45;
    }

    #drop-zone svg { display: block; margin: 0 auto 12px; }

    #drop-zone p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    #drop-zone p strong { color: var(--text); }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:not(:disabled):hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:not(:disabled):hover { background: #2d3f57; }

    .btn-success {
      background: #166534;
      color: #bbf7d0;
      border: 1px solid #22c55e44;
    }
    .btn-success:not(:disabled):hover { background: #15803d; }

    /* ── Output row ── */
    .output-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .output-row label {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    #output-path {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 12px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── File list ── */
    #file-section {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    #file-count {
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 20px;
    }

    #file-list {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    #file-list::-webkit-scrollbar { width: 6px; }
    #file-list::-webkit-scrollbar-track { background: transparent; }
    #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .file-item:last-child { border-bottom: none; }

    .file-icon { font-size: 16px; flex-shrink: 0; }

    .file-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .file-status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .status-pending { background: #1e3a5f; color: #93c5fd; }
    .status-converting { background: #3b2f00; color: #fde68a; }
    .status-ok { background: #14532d; color: #86efac; }
    .status-error { background: #450a0a; color: #fca5a5; }

    /* ── Progress ── */
    #progress-bar-wrap {
      background: var(--surface2);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      display: none;
    }

    #progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Footer ── */
    footer {
      padding: 12px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status-msg {
      flex: 1;
      font-size: 12px;
      color: var(--text-muted);
    }

    #clear-btn { display: none; }
    #open-output-btn { display: none; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 13px;
      gap: 6px;
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
      stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="14,2 14,8 20,8"
      stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="16" y1="13" x2="8" y2="13"
      stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="17" x2="8" y2="17"
      stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <polyline points="10,9 9,9 8,9"
      stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1>PDF → Markdown</h1>
  <span>Batch converter</span>
  <div style="flex:1"></div>
  <span class="badge">@opendocsg/pdf2md</span>
</header>

<main>

  <!-- Drop zone -->
  <div id="drop-zone">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" opacity="0.4">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
        stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="17,8 12,3 7,8"
        stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="3" x2="12" y2="15"
        stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <p><strong>Drop PDF files here</strong> or use buttons below</p>
    <div class="btn-row">
      <button class="btn-primary" id="pick-files-btn">Select PDF files</button>
      <button class="btn-secondary" id="pick-folder-btn">Select folder</button>
    </div>
  </div>

  <!-- Output folder -->
  <div class="output-row">
    <label>Output folder:</label>
    <div id="output-path">—</div>
    <button class="btn-secondary" id="change-output-btn">Change</button>
  </div>

  <!-- Progress bar -->
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>

  <!-- File list -->
  <div id="file-section">
    <div class="section-header">
      <h2>Files</h2>
      <span id="file-count">0</span>
    </div>
    <div id="file-list">
      <div class="empty-state" id="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" opacity="0.3">
          <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"
            stroke="#94a3b8" stroke-width="2"/>
          <polyline points="13,2 13,9 20,9"
            stroke="#94a3b8" stroke-width="2"/>
        </svg>
        <span>No files selected</span>
      </div>
    </div>
  </div>

</main>

<footer>
  <div id="status-msg">Ready</div>
  <button class="btn-secondary" id="clear-btn">Clear</button>
  <button class="btn-success" id="open-output-btn">Open output folder</button>
  <button class="btn-primary" id="convert-btn" disabled>Convert</button>
</footer>

<script src="renderer.js"></script>
</body>
</html>
